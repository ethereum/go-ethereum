# Shared network definitions. ChainID identifies each shard for EVM execution and routing.
# Internal routing lists are derived from the configured chain IDs: [100001, 100002].
NetworkID = 2

[Root]
ConsensusType = "POW_ETHASH"
# Intended root reward and staking chain; runtime integration follows separately.
CoinbaseChainID = 100001

[Root.PoSW]
AdjustmentCutoff = 7
AdjustmentFactor = 512
MinimumDifficulty = "1"
CoinbaseAmount = "0"
RewardTaxRate = "0"
EpochInterval = 3153600
DecayFactor = "0.88"
StakingEnabled = true
WindowSize = 256
StakePerBlock = "1000000000000000000000000000000"
DiffDivider = 20

[[Shards]]
ChainID = "100001"
HomesteadBlock = "0"
EIP150Block = "0"
EIP155Block = "0"
EIP158Block = "0"
ByzantiumBlock = "0"
ConstantinopleBlock = "0"
PetersburgBlock = "0"
IstanbulBlock = "0"
BerlinBlock = "0"
LondonBlock = "0"

[Shards.QuarkChain]
ConsensusType = "POW_ETHASH"
# Maximum blocks of this shard confirmed per root block; 0 means no cap.
MaxBlocksPerRootBlock = 18

# This shard uses ordinary PoW without the root chain's staking discount.
[Shards.QuarkChain.PoSW]
AdjustmentCutoff = 7
AdjustmentFactor = 512
MinimumDifficulty = "1"
CoinbaseAmount = "0"
RewardTaxRate = "0.5"
EpochInterval = 3153600
DecayFactor = "0.88"
StakingEnabled = false

[[Shards]]
ChainID = "100002"
HomesteadBlock = "0"
EIP150Block = "0"
EIP155Block = "0"
EIP158Block = "0"
ByzantiumBlock = "0"
ConstantinopleBlock = "0"
PetersburgBlock = "0"
IstanbulBlock = "0"
BerlinBlock = "0"
LondonBlock = "0"

[Shards.QuarkChain]
ConsensusType = "POW_SIMULATE"
MaxBlocksPerRootBlock = 18

[Shards.QuarkChain.PoSW]
AdjustmentCutoff = 7
AdjustmentFactor = 512
MinimumDifficulty = "1"
