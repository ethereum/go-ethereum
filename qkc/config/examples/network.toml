# Shared network definitions. ChainID identifies each shard for EVM execution and routing.
# Internal routing lists are derived from the configured chain IDs: [100001, 100002].
NetworkID = 2

# Shared EVM fork activation heights for every shard.
[ShardForks]
HomesteadBlock = "0"
EIP150Block = "0"
EIP155Block = "0"
EIP158Block = "0"
ByzantiumBlock = "0"
ConstantinopleBlock = "0"
PetersburgBlock = "0"
IstanbulBlock = "0"
BerlinBlock = "0"
LondonBlock = "0"

[Root]
ConsensusType = "POW_ETHASH"
# Chain receiving root rewards and hosting the root staking contract.
CoinbaseChainID = 100001

[Root.PoSW]
AdjustmentCutoff = 7
AdjustmentFactor = 512
MinimumDifficulty = "1"
CoinbaseAmount = "0"
RewardTaxRate = "0"
EpochInterval = 3153600
DecayFactor = "0.88"
StakingEnabled = true
WindowSize = 256
StakePerBlock = "1000000000000000000000000000000"
DiffDivider = 20

# Each entry maps to params.ChainConfig; see params/config.go for all fields.
# ChainID identifies this shard; [Shards.QuarkChain] maps to ChainConfig.QuarkChain
# (defined in params/quarkchain.go).
# The loader copies [ShardForks] into every chain config; those ten fields must
# be configured only in [ShardForks].
# Other native fields can be decoded, but QKC runtime support must be verified
# separately (for example, BogotaTime).
[[Shards]]
ChainID = "100001"

[Shards.QuarkChain]
ConsensusType = "POW_ETHASH"
# Maximum blocks of this shard confirmed per root block; 0 means no cap.
MaxBlocksPerRootBlock = 18

# This shard uses ordinary PoW without the root chain's staking discount.
[Shards.QuarkChain.PoSW]
AdjustmentCutoff = 7
AdjustmentFactor = 512
MinimumDifficulty = "1"
CoinbaseAmount = "0"
RewardTaxRate = "0.5"
EpochInterval = 3153600
DecayFactor = "0.88"
StakingEnabled = false

[[Shards]]
ChainID = "100002"

[Shards.QuarkChain]
ConsensusType = "POW_SIMULATE"
MaxBlocksPerRootBlock = 18

[Shards.QuarkChain.PoSW]
AdjustmentCutoff = 7
AdjustmentFactor = 512
MinimumDifficulty = "1"
CoinbaseAmount = "0"
RewardTaxRate = "0.5"
EpochInterval = 3153600
DecayFactor = "0.88"
StakingEnabled = true
WindowSize = 128
StakePerBlock = "500000000000000000000000000000"
DiffDivider = 10
