on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Free runner capacity by cancelling superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted-ghr, size-s-x64]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache build tools to avoid downloading them each time
    - uses: actions/cache@v4
      with:
        path: build/cache
        key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Go 1.27.2 export data is unreadable by x/tools v0.49.0 (gencodec, rlpgen).
        go-version: 1.27.1
        cache: false

    - name: Run linters
      run: |
        go run build/ci.go lint
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps

  keeper:
    name: Keeper Builds
    needs: test
    runs-on: [self-hosted-ghr, size-l-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Build
        run: go run build/ci.go keeper

  keeper-zisk:
    name: Keeper ZisK
    needs: lint
    runs-on: ubuntu-latest
    env:
      ZISK_VERSION: v1.4.0-alpha
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Install ziskemu dependencies
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-recommends install \
            clang cmake libclang-dev libgmp-dev libomp-dev libopenmpi-dev libsodium-dev libssl-dev nasm nlohmann-json3-dev protobuf-compiler uuid-dev

      - name: Restore ziskemu
        id: ziskemu-cache
        uses: actions/cache@v4
        with:
          path: ziskemu
          key: ziskemu-${{ env.ZISK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build ziskemu
        if: steps.ziskemu-cache.outputs.cache-hit != 'true'
        env:
          ZISK_CI_NO_DOCKER_REBUILD: '1'
        run: |
          git clone --quiet --depth 1 --branch "$ZISK_VERSION" https://github.com/0xPolygonHermez/zisk.git "$RUNNER_TEMP/zisk"
          cargo build --manifest-path "$RUNNER_TEMP/zisk/Cargo.toml" --release --locked -p ziskemu --features float
          cp "$RUNNER_TEMP/zisk/target/release/ziskemu" ziskemu

      - name: Build keeper
        working-directory: cmd/keeper
        run: GOOS=wasip1 GOARCH=wasm go build -tags zisk,zkvm -o keeper-zisk.wasm .

      - name: Run keeper in ziskemu
        working-directory: cmd/keeper
        run: ../../ziskemu --elf keeper-zisk.wasm --legacy-inputs 1192c3_payload.rlp

  test-32bit:
    name: "32bit tests"
    needs: test
    runs-on: [self-hosted-ghr, size-l-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-multilib

      - name: Build
        run: go run build/ci.go test -arch 386 -short -p 8

  test:
    name: Test
    needs: lint
    runs-on: [self-hosted-ghr, size-l-x64]
    strategy:
      matrix:
        go:
          - '1.27'
          - '1.26'
          - '1.25'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run tests
        run: go run build/ci.go test -p 8

  windows:
    name: Windows ${{ matrix.arch }}
    needs: lint
    runs-on: [self-hosted, windows, x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mingw: 'C:\msys64\mingw64'
            test: true
          - arch: '386'
            mingw: 'C:\msys64\mingw32'
            test: false
    env:
      GETH_MINGW: ${{ matrix.mingw }}
      GETH_CC: ${{ matrix.mingw }}\bin\gcc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Build
        shell: cmd
        run: |
          set PATH=%GETH_MINGW%\bin;%PATH%
          go run build/ci.go install -arch ${{ matrix.arch }} -cc %GETH_CC%

      - name: Run tests
        if: matrix.test
        shell: cmd
        run: |
          set PATH=%GETH_MINGW%\bin;%PATH%
          go run build/ci.go test -arch ${{ matrix.arch }} -cc %GETH_CC% -short -p 8
